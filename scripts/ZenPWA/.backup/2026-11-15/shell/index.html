<!DOCTYPE html>
<html lang="en" data-scheme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Zen PWA</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body class="booting">

  <div id="content">
    <div id="webview-host"></div>
    <div id="error" hidden>
      <div class="error-card">
        <div class="error-glyph">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4L12 3.5Z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></svg>
        </div>
        <h2 id="error-title">This page didn't load</h2>
        <p id="error-detail">Check your connection and try again.</p>
        <div class="error-actions">
          <button id="error-retry" class="primary">Try Again</button>
          <button id="error-zen">Open in Zen</button>
        </div>
      </div>
    </div>
  </div>

  <div id="border" aria-hidden="true"></div>
  <div id="dragstrip" aria-hidden="true"></div>

  <header id="toolbar" aria-hidden="true" aria-label="Browser toolbar">
    <div class="group traffic" aria-label="Window controls">
      <button class="tl close" data-action="close" title="Close Window" aria-label="Close Window">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.4 2.4 7.6 7.6M7.6 2.4 2.4 7.6"/></svg>
      </button>
      <button class="tl minimize" data-action="minimize" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.4 5h5.2"/></svg>
      </button>
      <button class="tl zoom" data-action="zoom" title="Zoom" aria-label="Zoom">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5h5v5h-5z"/></svg>
      </button>
    </div>

    <div class="group nav">
      <button data-action="back" id="btn-back" title="Back (⌘[)" aria-label="Back" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <button data-action="forward" id="btn-forward" title="Forward (⌘])" aria-label="Forward" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
      </button>
      <button data-action="reload" id="btn-reload" title="Reload (⌘R)" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4.5V10h-5.5"/></svg>
      </button>
    </div>

    <div id="address" class="address" role="button" tabindex="0" title="Click to edit the address">
      <span class="leading">
        <svg id="lock" class="lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7.5a5 5 0 0 1 10 0V10"/><rect x="4.8" y="10" width="14.4" height="9.6" rx="2.4"/></svg>
        <img id="favicon" class="favicon" alt="" hidden />
        <span id="monogram" class="monogram" hidden></span>
      </span>
      <span id="title" class="title">Loading…</span>
      <span id="host" class="host"></span>
      <input id="url" class="url" spellcheck="false" autocomplete="off" autocapitalization="off" aria-label="Address" />
    </div>

    <div class="group actions">
      <button data-action="copy" title="Copy URL (⌘⇧C)" aria-label="Copy URL">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.4"/><path d="M15 6.2V5.4A2.4 2.4 0 0 0 12.6 3H6.4A2.4 2.4 0 0 0 4 5.4v6.2A2.4 2.4 0 0 0 6.4 14h.8"/></svg>
      </button>
      <button data-action="menu" id="btn-menu" title="More" aria-label="More">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>
      </button>
    </div>

    <div id="progress" aria-hidden="true"></div>
  </header>

  <div id="splash">
    <div class="splash-inner">
      <div class="splash-icon" id="splash-icon">
        <span id="splash-monogram">Z</span>
      </div>
      <div class="splash-name" id="splash-name">Zen PWA</div>
      <div class="splash-host" id="splash-host"></div>
      <div class="splash-status"><span class="spinner" aria-hidden="true"></span><span id="splash-status-text">Starting…</span></div>
    </div>
  </div>

  <div id="toast" hidden role="status"></div>

  <script src="shell.js"></script>
</body>
</html>
