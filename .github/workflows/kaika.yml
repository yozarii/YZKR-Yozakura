name: kaika

on:
  push:
    paths:
      - "kaika/**"
  pull_request:
    paths:
      - "kaika/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kaika
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Test (hermetic; opt-in real_model tests are not run)
        run: cargo test
      - name: Release build
        run: cargo build --release
