[package]
name = "kaika"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Universal package manager for macOS (Apple silicon)"
license = "MIT"
repository = "https://github.com/yozarii/YZKR-Yozakura"
readme = "README.md"
keywords = ["package-manager", "macos", "homebrew", "cli"]
categories = ["command-line-utilities"]
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
toml = "1.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
